<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>
</head>
<body>
    <!-- This is for checking text formatting tags -->
    <center>
        <h4><marquee>This is an alternate Marquee text</marquee></h4>
        <h4>This is <i>italicized</i></h4>
        <h4>This is <u>underlined</u></h4>
        <h4>This is <b><big>bold</big></b></h4>
        <h4>This is <small><i>emphasized</i></small></h4>
        <h4>This is <big>Strong Text</big></h4>
        <h4>This is <s>striked text</s></h4>
        <h4>This is <sup>supscript</sup> code</h4>
        <h4>This is <sub>supscript</sub> code</h4>
        <h4>This is <big>italicized</big></h4>
        <h4>This is <small>italicized</small></h4>
    </center>
</body>
</html>
